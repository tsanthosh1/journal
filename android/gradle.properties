# Gradle Memory & Performance Configuration
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# AndroidX support
android.useAndroidX=true

# Kotlin style
kotlin.code.style=official

# Speed up Gradle builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
